name = "wanderer-payment-api"
main = "src.js"
compatibility_date = "2026-11-01"

[vars]
# เปลี่ยนเป็น URL Cloudflare Pages ของเว็บชำระเงินใหม่เท่านั้น ไม่มี slash ท้ายสุด
ALLOWED_ORIGIN = "https://YOUR-PAYMENT-PROJECT.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "wanderer-payment-db"
database_id = "REPLACE_WITH_NEW_D1_DATABASE_ID"
migrations_dir = "migrations"
